# Steps template: compara tasks/linceo-install/tool-pins.json y
# tasks/linceo-scan/linceo-pins.json contra el release más reciente de
# linceo (Dockerfile y pyproject.toml — ADR-000 §12.7/§12.8). Vive en su
# propio pipeline (azure-pipelines-linceo-pins-check.yml), nunca en el de
# build/publish — ver ese fichero para el motivo.
steps:
  - task: NodeTool@0
    displayName: 'Use Node 20.x'
    inputs:
      versionSpec: '20.x'

  # Sin npm install: el script sólo usa módulos nativos de Node (https,
  # fs, path) a propósito, para no traer una dependencia sólo por esto.
  - script: node scripts/check-linceo-pins-drift.js
    displayName: 'Comparar tool-pins.json / linceo-pins.json contra el release público de linceo'
