variables:
  - name: Extension.ServiceConnection
    # Nombre de la service connection tipo "Visual Studio Marketplace" que
    # hay que crear a mano en el proyecto de Azure DevOps — ver
    # docs/PUBLISHING.md. Si se crea con otro nombre, cambiar sólo este
    # valor.
    value: 'marketplace-service-connection'

  # Publisher/id SÍ viven aquí ahora, a diferencia de antes — pero por un
  # motivo distinto al que se descartó: PublishAzureDevOpsExtension sigue
  # sin recibirlos (ver publish.yaml, sigue siendo cierto). Los consume
  # únicamente IsAzureDevOpsExtensionValid, que es de sólo lectura contra
  # el Marketplace y no repaqueta nada — necesita saber qué extensión
  # consultar, no tiene forma de leerlo del .vsix como sí puede inferir
  # publish. Deben coincidir con vss-extension.json:publisher/:id; si
  # alguna vez divergen, esta tarea consulta la extensión equivocada, no
  # publica nada mal.
  - name: Extension.Publisher
    value: 'juandiego-13'
  - name: Extension.Id
    value: 'linceo-devsecops-scan'
