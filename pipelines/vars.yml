variables:
  - name: Extension.ServiceConnection
    # Nombre de la service connection tipo "Visual Studio Marketplace" que
    # hay que crear a mano en el proyecto de Azure DevOps — ver
    # docs/PUBLISHING.md. Si se crea con otro nombre, cambiar sólo este
    # valor.
    value: 'marketplace-service-connection'

# Publisher/id/nombre de la extensión NO viven aquí — publish.yaml no los
# pasa como override a PublishAzureDevOpsExtension (ver el porqué en ese
# archivo). La única fuente de verdad para esos tres campos es
# vss-extension.json; mantener una copia aquí que nada consume ya fue,
# literalmente, la clase de duplicado que causó la investigación que llevó
# a este diseño.
