# Steps template: publica al Marketplace el .vsix que ya produjo y validó
# la etapa "build" — nunca reconstruye ni reempaqueta. Esto es deliberado:
# el artefacto que se publica debe ser exactamente el mismo que pasó la
# validación, nunca uno reconstruido después.
#
# Por eso PublishAzureDevOpsExtension recibe únicamente fileType/vsixFile/
# connectTo/connectedServiceName, y NADA más — ni extensionVersion, ni
# publisherId/extensionId/extensionName/extensionVisibility/
# extensionPricing/updateTasksId. Investigado a fondo (no de memoria) tras
# un fallo real: cualquiera de esos seis inputs, no vacío ni distinto de
# "default", hace que PublishExtension.ts (microsoft/azure-devops-
# extension-tasks) entre en su rama de VsixEditor — que SIEMPRE
# desempaqueta, edita y reempaqueta el .vsix en un archivo nuevo
# (`vsixGeneratedFile`), sin comparar contra lo que el manifiesto ya trae
# (`hasEdits()` es un OR de "¿se pidió un edit?", no "¿cambia algo?" —
# vsixeditor.ts). No hay forma de pasar cualquiera de estos inputs sin
# reconstruir.
#
# Por eso el fix del error real ("Extension Version was not supplied nor
# does the extension manifest define one") no es pasarle extensionVersion
# a esta tarea — eso dispara exactamente esa rama, y encima explota:
# `VsixEditor.endEdit()` busca la versión en el extension.vsomanifest
# extraído del propio .vsix, no en vss-extension.json, y tfx extension
# create nunca escribe un campo version ahí (confirmado inspeccionando un
# .vsix real de este proyecto: extension.vsixmanifest sí trae
# Version="X.Y.Z" en su nodo Identity; extension.vsomanifest no trae
# ningún campo version en absoluto). El fix real es que build ya deja la
# versión correcta DENTRO del manifiesto empaquetado (ver
# "Derivar versión del tag" en build.yml, y la Identity/@Version del
# .vsix resultante) y publish la publica tal cual — sin decirle a esta
# tarea que edite nada, porque no hace falta: ya está todo correcto ahí
# dentro (publisher, id, nombre, y la ausencia de <GalleryFlags> ya
# significa privado, sin necesidad de forzarlo).
steps:
  - checkout: none

  - task: DownloadBuildArtifacts@1
    displayName: 'Descargar artefacto Extension'
    inputs:
      buildType: 'current'
      downloadType: 'single'
      artifactName: 'Extension'
      downloadPath: '$(System.ArtifactsDirectory)'

  - task: TfxInstaller@5
    inputs:
      version: 'v0.12.x'

  # Requiere la extensión "Azure DevOps Extension Tasks" (microsoft/
  # azure-devops-extension-tasks) instalada en la organización, y una
  # service connection tipo "Visual Studio Marketplace" con el nombre de
  # $(Extension.ServiceConnection) — ver docs/PUBLISHING.md para ambos.
  #
  # noWaitValidation: true — deliberado, investigado contra el código
  # fuente de tfx-cli, no adivinado. Sin este flag, tfx entra a su propio
  # loop de espera (waitForValidation en
  # app/exec/extension/_lib/publish.ts): para una extensión privada,
  # reintenta hasta 120 veces con intervalo creciente hasta 2s (~4
  # minutos) y si no hay veredicto para entonces, tira
  # "Validation is taking much longer than usual" y sale con código 255 —
  # aunque la subida ya haya funcionado. Esos números están hardcodeados
  # en tfx-cli, no son un input de esta tarea; no hay forma de "esperar
  # más" aquí, sólo esperar o no esperar. Con noWaitValidation: true, tfx
  # reporta éxito apenas la subida termina, sin entrar a ese loop — la
  # validación se comprueba aparte, en el paso siguiente, con un
  # presupuesto de espera propio y sí configurable.
  - task: PublishAzureDevOpsExtension@5
    displayName: 'Publicar en el Marketplace'
    inputs:
      connectTo: 'VsTeam'
      connectedServiceName: '$(Extension.ServiceConnection)'
      fileType: 'vsix'
      vsixFile: '$(System.ArtifactsDirectory)/Extension/*.vsix'
      noWaitValidation: true

  # Chequeo de sólo lectura contra la API del Marketplace (tfx extension
  # isvalid) — no toca el .vsix, no repaqueta, no comparte código con
  # VsixEditor. Publisher/id sí hacen falta aquí (identifican qué
  # extensión consultar; a diferencia de Publish, esta tarea no puede
  # inferirlos de un .vsix porque no recibe ninguno). extensionVersion
  # queda sin fijar a propósito: su default vacío significa "revisa la
  # última versión enviada" (tfx-cli, IsValidExtension.ts:
  # `tfx.argIf(extensionVersion, ["--version", extensionVersion])` — vacío
  # no agrega el flag) — no hace falta, y evitarlo evita reabrir el mismo
  # tipo de problema que ya causó el error original.
  #
  # Reintentos propios (maxRetries × minTimeout ≈ 10 minutos por
  # defecto) — más generoso que los ~4 minutos internos de Publish, y
  # ajustable si hiciera falta más margen.
  - task: IsAzureDevOpsExtensionValid@5
    displayName: 'Confirmar validación en el Marketplace'
    inputs:
      connectTo: 'VsTeam'
      connectedServiceName: '$(Extension.ServiceConnection)'
      method: 'id'
      publisherId: '$(Extension.Publisher)'
      extensionId: '$(Extension.Id)'
      maxRetries: 10
      minTimeout: 1
